# Two-node live Podman task solving: one 8-GPU trainer node plus one 8-GPU
# inference node. Start services.yaml against the same REGISTRY first.
max_steps = 400
output_dir = "/weka/gfaria/primebeaker/outputs/podman-terminal-multinode"
clean_output_dir = false

[trainer]
enable_token_export = true

[trainer.loss]
type = "default"
aggregation = "group_token_mean"
kl_tau = 0.0

[trainer.model]
name = "Qwen/Qwen3.5-4B"
seq_len = 131072
cp = 1
dp_replicate = 8
cp_style = "ulysses"
ac = { mode = "full", freq = 1 }
ac_offloading = "None"
fsdp_cpu_offload = false
optim_cpu_offload = false
optimization_dtype = "bfloat16"
reduce_dtype = "bfloat16"
attn = "auto"
impl = "auto"

[trainer.optim]
type = "adamw"
lr = 4e-6
max_norm = 1.0
weight_decay = 0.0
eps = 1e-12
betas1 = 0.95
betas2 = 0.95

[wandb]
project = "primebeaker-examples"
name = "primebeaker-podman-terminal-multinode"
tags = ["primebeaker", "podman", "terminal-agent", "rule-reward", "multinode"]

[orchestrator]
batch_size = 512
group_size = 32
seq_len = 32768
max_off_policy_steps = 4
oversampling_factor = 2
eval_max_inflight_episodes = 64

[orchestrator.model]
name = "Qwen/Qwen3.5-4B"

[orchestrator.train.sampling]
max_completion_tokens = 8192
temperature = 1.0

[orchestrator.train.sampling.extra_body]
top_p = 0.97

[orchestrator.train.sampling.extra_body.chat_template_kwargs]
enable_thinking = true

[[orchestrator.train.source]]
name = "podman-terminal-train"

[orchestrator.train.source.legacy]
id = "primebeaker.environments.podman_terminal_env"

[orchestrator.train.source.legacy.args]
dataset = "examples/podman-terminal/data/train.jsonl"
split = "train"
podman_gateway_url = "http://127.0.0.1:1212"
podman_workdir = "/home/user"
completion_marker = "TERMINAL_COMPLETE"
reward_file_path = "/tmp/primebeaker-reward.txt"
test_file_path = "/tmp/primebeaker-test-final-state.py"
test_command = '''if python3 -m pytest -q /tmp/primebeaker-test-final-state.py; then printf 1 > /tmp/primebeaker-reward.txt; else printf 0 > /tmp/primebeaker-reward.txt; fi'''
command_timeout = 60
test_timeout = 120
max_tool_calls = 64
max_turns = 65
reward_file_weight = 1.0
termination_reward_weight = 0.1
podman_failure_penalty_weight = 1.0
fake_tool_penalty_weight = 0.1

[orchestrator.eval]
interval = 25

[orchestrator.eval.sampling]
max_completion_tokens = 8192
temperature = 0.0

[[orchestrator.eval.source]]
name = "podman-terminal-validation"
num_examples = 32
group_size = 1

[orchestrator.eval.source.legacy]
id = "primebeaker.environments.podman_terminal_env"

[orchestrator.eval.source.legacy.args]
dataset = "examples/podman-terminal/data/validation.jsonl"
split = "validation"
podman_gateway_url = "http://127.0.0.1:1212"
podman_workdir = "/home/user"
completion_marker = "TERMINAL_COMPLETE"
reward_file_path = "/tmp/primebeaker-reward.txt"
test_file_path = "/tmp/primebeaker-test-final-state.py"
test_command = '''if python3 -m pytest -q /tmp/primebeaker-test-final-state.py; then printf 1 > /tmp/primebeaker-reward.txt; else printf 0 > /tmp/primebeaker-reward.txt; fi'''
command_timeout = 60
test_timeout = 120
max_tool_calls = 64
max_turns = 65
reward_file_weight = 1.0
termination_reward_weight = 0.1
podman_failure_penalty_weight = 1.0
fake_tool_penalty_weight = 0.1

[orchestrator.renderer]
name = "qwen3.5"
enable_thinking = true
thinking_retention = "tool_cycle"

[inference]
gpu_memory_utilization = 0.9
api_server_count = 8
enable_prefix_caching = true

[inference.server]
host = "0.0.0.0"
port = 8000

[inference.model]
name = "Qwen/Qwen3.5-4B"
trust_remote_code = true
max_model_len = 32768
tool_call_parser = "qwen3_coder"
reasoning_parser = "qwen3"
dtype = "bfloat16"

[inference.vllm_extra]
language_model_only = true
max_num_batched_tokens = 32768

[inference.env_vars]
VLLM_ATTENTION_BACKEND = "FLASH_ATTN"
VLLM_USE_TRITON_FLASH_ATTN = "1"

[inference.parallel]
tp = 1
dp = 8

[deployment]
type = "multi_node"
gpus_per_node = 8
num_train_nodes = 1
num_infer_nodes = 1
num_infer_replicas = 1

[weight_broadcast]
type = "nccl"

[ckpt]
interval = 10
keep_last = 4
keep_interval = 10
resume_step = -1

[log]
level = "info"
