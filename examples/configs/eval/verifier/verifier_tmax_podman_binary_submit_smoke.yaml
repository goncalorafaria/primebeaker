workflow: verifier-tmax-podman-binary-submit-v3
image: beaker://REPLACE_WITH_IMMUTABLE_JTC_EVAL_IMAGE
run_dir: /weka/gfaria/evals/verifier-tmax-podman-binary-submit-smoke
arguments:
  input_path: /weka/gfaria/records/tmax-binary-verifier-smoke.jrows.parquet
  output_path: /weka/gfaria/evals/verifier-tmax-podman-binary-submit-smoke/predictions.parquet
  model_path: /weka/gfaria/models/policy
  prompt_chat_template_path: templates/tmax-podman-trace-submit-binary-gptoss.v2.json
  max_rows: 8
  batch_size: 8
services:
  python_replicas: 0
  terminal_replicas: 2
  web_search_replicas: 0
  local_search_replicas: 0
  generation_model: /weka/gfaria/models/policy
  generation_replicas: 2
  generation_tp: 1
  max_model_len: 32768
  max_num_batched_tokens: 32768
  service_clusters: [ai2/jupiter]
  model_cluster: ai2/holmes
  service_priority: high
  model_priority: high
  min_runtime_hours: 1
  omit_service_resources: true
required_services:
  /weka/gfaria/models/policy: 1
  terminal: 1
