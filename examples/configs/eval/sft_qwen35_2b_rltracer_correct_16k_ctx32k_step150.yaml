# Standard evaluation for the step-150 checkpoint of the Qwen3.5-2B
# rltracer-correct SFT continuation.  Match the Harmony terminal recipe used
# to generate the training traces and preserve its 32K interaction budget.
max_model_len: 32768
evaluation:
  model: /weka/gfaria/prime_sft/outputs/sft_qwen35_2b_rltracer_correct_16k_ctx32k_246steps_retry1/weights/step_150
  run_dir: /weka/gfaria/jtc-artifacts/evals/sft_qwen35_2b_rltracer_correct_16k_ctx32k_step150
  datasets: [frontier_science, healthbench, drtulu_gold, profbench, researchqa, wildguard_test]
  cluster: ai2/holmes
  priority: high
  model_replicas: 2
  max_num_batched_tokens: 65536
  runs: 3
  verifier_tools: terminal
  verifier_prompt_chat_template_path: templates/jtc-io-terminal-prompt-gptoss-harmony.json
  verifier_max_iters: 16
  terminal_replicas: 8
  python_replicas: 0
  search_replicas: 0
  llm_max_retries: 20
  gateway_timeout_seconds: 200
  batch_size: 512
  readiness_timeout_seconds: 7200
