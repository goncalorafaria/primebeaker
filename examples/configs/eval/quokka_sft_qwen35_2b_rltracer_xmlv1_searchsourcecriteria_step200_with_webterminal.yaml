# Evaluate the completed Quokka RLTracer XML-v1 SFT checkpoint with the same
# browser-aware terminal contract used to construct its training prompts.
max_model_len: 32768
workspace: ai2/oe-agents
evaluation:
  model: /weka/gfaria/prime_sft/outputs/quokka_sft_qwen35_2b_base_rltracer_16k_xmlv1_searchsourcecriteria_v3_32k_lr2e-5_200steps/weights/step_200
  run_dir: /weka/gfaria/jtc-artifacts/evals/quokka_sft_qwen35_2b_rltracer_xmlv1_searchsourcecriteria_step200_with_webterminal
  datasets:
    - frontier_science
    - healthbench
    - drtulu_gold
    - profbench
    - researchqa
    - wildguard_test
    - safety_terminal_test
  cluster: ai2/holmes
  service_cluster: ai2/jupiter
  priority: high
  min_runtime_hours: 0
  model_replicas: 2
  max_num_batched_tokens: 65536
  runs: 3
  verifier_tools: webterminal
  verifier_prompt_chat_template_path: templates/jtc-io-terminal-release-browse-xml-v1.json
  verifier_max_iters: 64
  terminal_replicas: 8
  terminal_image: goncalof/literegistry-terminal-1-0-27-pandoc5-sortuniq-tr-cut2
  python_replicas: 0
  search_replicas: 0
  local_search_model_path: localsearch:bc-v2-72k
  llm_max_retries: 20
  gateway_timeout_seconds: 1000
  batch_size: 512
  readiness_timeout_seconds: 7200
