# Search Quokka 9B SFT evaluation. This is matched to Base Quokka: only the
# checkpoint and run directory differ. ``webterminal`` is the execution
# backend while the model sees the template-defined native ``terminal`` tool.
max_model_len: 32768
registry: redis://jupiter-cs-aus-183.reviz.ai2.in:59936
evaluation:
  model: /weka/gfaria/prime_sft/outputs/search_quokka_sft_qwen35_9b_releasebrowse_4a31bbe_32k_lr1e-5_200steps/weights/step_200
  run_dir: /weka/gfaria/jtc-artifacts/evals/search_quokka_sft_qwen35_9b_releasebrowse_step200_with_webterminal
  datasets:
    - frontier_science
    - healthbench
    - drtulu_gold
    - profbench
    - researchqa
    - wildguard_test
    - safety_terminal_test
  cluster: ai2/holmes
  service_cluster: ai2/jupiter
  priority: high
  min_runtime_hours: 1
  model_replicas: 2
  max_num_batched_tokens: 65536
  runs: 3
  verifier_tools: webterminal
  verifier_prompt_chat_template_path: templates/jtc-io-terminal-release-browse.json
  verifier_max_iters: 64
  terminal_replicas: 8
  terminal_image: goncalof/literegistry-terminal-1-0-27-pandoc5-sortuniq-tr-cut2
  python_replicas: 0
  search_replicas: 0
  local_search_model_path: localsearch:bc-v2-72k
  llm_max_retries: 20
  gateway_timeout_seconds: 200
  batch_size: 512
  readiness_timeout_seconds: 7200
