# Full BrowseComp+ evaluation of the saved step-140 checkpoint from the
# WebTerminal search-agent run. Reuse the running Jupiter tool/judge registry;
# this evaluator contributes only the policy VLLM replicas and removes those
# replicas when the local rollout finishes.
workflow: search-agent
search_agent:
  model: /weka/gfaria/prime_sft/outputs/qwen35_4b_base_search_webterminal_agent_step400-from-scratch-quokka9b-judge-local-bc-v2-browsecomp-oversampling2-ctx128k-multinode-train4-infer24/weights/step_140
  dataset: /weka/gfaria/records/browsecomp_plus_tevatron.jtasks.parquet
  run_dir: /weka/gfaria/prime_sft/outputs/qwen35_4b_base_search_webterminal_agent_step400-from-scratch-quokka9b-judge-local-bc-v2-browsecomp-oversampling2-ctx128k-multinode-train4-infer24/search_agent_eval_browsecomp_plus_webterminal_judge_step140
  cluster: ai2/holmes
  service_cluster: ai2/jupiter
  # Beaker applies workspace at the experiment level. The GPU-bearing policy
  # and judge VLLM tasks are constrained to Holmes below.
  workspace: ai2/oe-agents-holmes
  budget: ai2/oe-omai
  priority: high
  min_runtime_hours: 1
  registry: redis://jupiter-cs-aus-216.reviz.ai2.in:62240

  model_replicas: 4
  required_model_replicas: 1
  tensor_parallelism: 1
  max_model_len: 131072
  max_num_batched_tokens: 131072

  # Reuse the BrowseComp+ pool for both search and WebTerminal `browse`.
  local_search_replicas: 0
  local_search_model_path: localsearch:browsecomp-plus

  # Match the training environment rather than the older direct-visit harness.
  harness: webterminal-judge
  terminal_truncation: 10000
  template_path: templates/search-agent-webterminal-10k.json
  visit_max_content_length: 64000
  max_tool_calls: 150
  max_turns: 151
  max_tokens: 32768
  max_total_completion_tokens: 131072

  judge_model_path: /weka/gfaria/prime_sft/outputs/quokka-sft-qwen35-9b-rltracer-xmlv1-search25-baseformula-ba8d07-step400/weights/step_400
  judge_model_replicas: 0
  judge_tensor_parallelism: 1
  judge_max_model_len: 32768
  judge_max_num_batched_tokens: 131072
  judge_replicas: 0
  judge_service_model_path: judge
  judge_timeout: 240
  judge_max_retries: 3
  judge_rubric_template: "The final answer the model concluded is: {answer}"

  max_rows: 830
  # Run 128 independent agent episodes concurrently. The workflow applies
  # this as a semaphore around a whole rollout, not a token batch size.
  batch_size: 128
  model_ready_timeout: 86400
  keep_stack: false
