# Clean WildGuard recovery for the base Qwen 3.5 35B-A3B model.
evaluation:
  model: Qwen/Qwen3.5-35B-A3B
  run_dir: /weka/gfaria/jtc-artifacts/evals/qwen35_35b_a3b_base-wildguard-recovery3-8gpu
  datasets: [wildguard_test]
  cluster: ai2/holmes
  priority: high
  model_replicas: 8
