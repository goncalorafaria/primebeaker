# Seven-suite evaluation of the Lion 9B RL step-400 checkpoint, including the
# held-out terminal safety test.
workspace: ai2/oe-agents-holmes
max_model_len: 32768
evaluation:
  model: /weka/gfaria/prime_sft/outputs/lion_qwen35_9b_qwen38_hintmix_sft_step200_rl_97a962-step400-lr4e-6-kl1e-3-b95-wd0-ctx32k-tool64-tu0-stderrpen0p1/weights/step_400
  run_dir: /weka/gfaria/jtc-artifacts/evals/lion_qwen35_9b_qwen38_hintmix_rl_97a962_step400_with_terminal_safety
  datasets:
    - frontier_science
    - healthbench
    - drtulu_gold
    - profbench
    - researchqa
    - wildguard_test
    - safety_terminal_test
  cluster: ai2/holmes
  service_cluster: ai2/jupiter
  priority: high
  min_runtime_hours: 1
  model_replicas: 2
  max_num_batched_tokens: 65536
  runs: 3
  verifier_tools: terminal
  verifier_prompt_chat_template_path: templates/jtc-io-terminal-prompt-gptoss-harmony.json
  verifier_max_iters: 64
  terminal_replicas: 8
  terminal_image: goncalof/literegistry-terminal-1-0-27-pandoc5-sortuniq-tr
  python_replicas: 0
  search_replicas: 0
  llm_max_retries: 20
  gateway_timeout_seconds: 200
  batch_size: 512
  readiness_timeout_seconds: 7200
