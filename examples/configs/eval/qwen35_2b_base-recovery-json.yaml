# Full modern baseline evaluation of the unmodified Hugging Face Qwen 3.5 2B model.
evaluation:
  model: Qwen/Qwen3.5-2B
  run_dir: /weka/gfaria/jtc-artifacts/evals/qwen35_2b_base-recovery-json
  datasets:
    - frontier_science
    - healthbench
    - drtulu_gold
    - profbench
    - researchqa
    - wildguard_test
  cluster: ai2/holmes
  priority: high
  model_replicas: 4
  max_num_batched_tokens: 65536
  runs: 3
  verifier_tools: none
  verifier_prompt_chat_template_path: templates/jtc-io-simple-prompt-json.json
  verifier_max_iters: 1
  terminal_replicas: 0
  python_replicas: 0
  search_replicas: 0
  llm_max_retries: 20
  gateway_timeout_seconds: 200
  readiness_timeout_seconds: 7200
