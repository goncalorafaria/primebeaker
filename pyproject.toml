[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primebeaker"
version = "0.4.0"
description = "Self-contained Prime-RL environments, TOML tooling, and Beaker launchers."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["fire>=0.7.1", "pydantic>=2.7", "literegistry-tool-client>=0.1.2,<0.2"]

[project.optional-dependencies]
judge = ["primebeaker[runtime]", "jtc-core[evals,harness]==0.3.0", "openai", "starlette"]
evaluation = ["jtc-core[evals,harness]==0.3.0"]
watcher = ["fastapi", "jtc-core==0.3.0", "PyYAML>=6.0", "uvicorn", "wandb"]
runtime = [
    "aiohttp",
    "datasets",
    "httpx",
    "literegistry-podman-client==0.1.6",
    "transformers",
    "literegistry-base-deployment==0.1.7",
    "literegistry-podman-beaker==0.2.21",
    "literegistry[base_deployment,podman_beaker]==1.0.60",
    "PyYAML>=6.0",
    "uvicorn",
    "verifiers[harbor]==0.2.1",
]
test = ["pytest>=8"]
full = ["primebeaker[runtime,evaluation,watcher,judge]"]

[project.scripts]
primebeaker = "primebeaker.cli:main"
primebeaker-judge = "primebeaker.judge.judge_server:cli"
primebeaker-images = "primebeaker.images.__main__:main"

[tool.setuptools]
packages = [
    "primebeaker",
    "primebeaker.environments",
    "primebeaker.images",
    "primebeaker.judge",
    "primebeaker.resources",
    "primebeaker.resources.judge_profiles",
    "primebeaker.resources.judge_templates",
    "primebeaker.resources.templates",
    "primebeaker.runtime",
    "primebeaker.watcher",
    "primebeaker_jtc_tool_label",
    "primebeaker_articulated_harness",
    "primebeaker_rubrichub_judge",
    "primebeaker_mc_accuracy",
]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
primebeaker = [
    "multinode_*_role.sh",
    "images/*.json",
    "images/*.md",
    "images/Dockerfile.*",
    "resources/judge_profiles/*.json",
    "resources/judge_templates/*.json",
    "resources/templates/*.json",
    "watcher/README.md",
]

[tool.uv]
# jtc-core 0.3.0 pins older registry dependencies. Match the replay deployment.
override-dependencies = ["literegistry==1.0.60", "literegistry-tool-client==0.1.2"]
