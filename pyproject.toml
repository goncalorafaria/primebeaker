[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primebeaker"
version = "0.3.0"
description = "Self-contained Prime-RL environments, clients, TOML tooling, and Beaker launchers."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["fire>=0.7.1", "pydantic>=2.7"]

[project.optional-dependencies]
runtime = [
    "aiohttp",
    "datasets",
    "httpx",
    "literegistry==1.0.47",
    "uvicorn",
    "verifiers[harbor] @ git+https://github.com/PrimeIntellect-ai/verifiers.git@f646beb37eef51869f886f244456e3d07818e4d6",
]
test = ["pytest>=8"]
full = ["primebeaker[runtime]"]

[project.scripts]
primebeaker = "primebeaker.cli:main"
primebeaker-images = "primebeaker.images.__main__:main"

[tool.setuptools]
packages = [
    "primebeaker",
    "primebeaker.client",
    "primebeaker.environments",
    "primebeaker.images",
    "primebeaker.resources",
    "primebeaker.resources.templates",
    "primebeaker.runtime",
]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
primebeaker = [
    "multinode_*_role.sh",
    "images/*.json",
    "images/*.md",
    "images/Dockerfile.*",
    "resources/templates/*.json",
]
"primebeaker.client" = ["py.typed"]
