[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primebeaker"
version = "0.3.0"
description = "Self-contained Prime-RL environments, TOML tooling, and Beaker launchers."
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["fire>=0.7.1", "pydantic>=2.7", "literegistry-tool-client>=0.1.0,<0.2"]

[project.optional-dependencies]
runtime = [
    "aiohttp",
    "datasets",
    "httpx",
    "literegistry[base_deployment,podman_beaker]==1.0.48",
    "PyYAML>=6.0",
    "uvicorn",
    "verifiers[harbor]==0.2.1",
]
test = ["pytest>=8"]
full = ["primebeaker[runtime]"]

[project.scripts]
primebeaker = "primebeaker.cli:main"
primebeaker-images = "primebeaker.images.__main__:main"

[tool.setuptools]
packages = [
    "primebeaker",
    "primebeaker.environments",
    "primebeaker.images",
    "primebeaker.resources",
    "primebeaker.resources.judge_profiles",
    "primebeaker.resources.judge_templates",
    "primebeaker.resources.templates",
    "primebeaker.runtime",
]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
primebeaker = [
    "multinode_*_role.sh",
    "images/*.json",
    "images/*.md",
    "images/Dockerfile.*",
    "resources/judge_profiles/*.json",
    "resources/judge_templates/*.json",
    "resources/templates/*.json",
]
